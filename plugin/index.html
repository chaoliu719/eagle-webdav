<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle WebDAV</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#F3F4F7; --card:#FFFFFF; --line:#E4E6EC; --line-soft:#ECEEF3; --field:#FFFFFF; --field-line:#DADDE5; --well:#F3F4F7; --seg:#ECEEF3; --seg-on:#FFFFFF;
    --fg:#16181D; --mut:#6A6F7E; --faint:#8A8F9E; --acc:#2563EB; --acc-weak:#E8EFFE; --acc-off:#C6D4F7; --ok:#1F9D55; --ok-text:#167A42; --off:#C9CDD8; --dot-off:#B5B9C6;
    --warn:#B26A00; --warn-bg:#FFF4DC; --warn-line:#F0DDAA; --warn-title:#8A5A00; --warn-text:#9A6200; --bad:#C62828; --bad-bg:#FDECEC; --bad-line:#F3C4C4; --bad-title:#9B1C1C; --bad-text:#B04040;
    --purple:#7C3AED; --purple-weak:#F1E9FB; --shadow:0 1px 2px rgba(20,24,40,.14);
    --toast-bg:#1F2229; --toast-fg:#FFFFFF; --toast-shadow:0 8px 24px rgba(20,24,40,.28); --toast-ok:#4ED58A; --toast-bad:#FF8A80; --toast-mut:#B7BCC9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#151619; --card:#1F2126; --line:#2C2F36; --line-soft:#2C2F36; --field:#2A2D34; --field-line:#3A3E47; --well:#2A2D34; --seg:#2A2D34; --seg-on:#43474F;
      --fg:#F1F2F5; --mut:#9AA0AE; --faint:#7E8494; --acc:#4C80EA; --acc-weak:#22304F; --acc-off:#33466F; --ok:#2FB66B; --ok-text:#4ED58A; --off:#454952; --dot-off:#6B7080;
      --warn:#F5B54A; --warn-bg:#3A3018; --warn-line:#5A4A20; --warn-title:#F5C873; --warn-text:#D6B068; --bad:#FF7B72; --bad-bg:#3A1E1F; --bad-line:#5C2B2D; --bad-title:#FF9A92; --bad-text:#E39891;
      --purple:#B493F5; --purple-weak:#2F2547; --shadow:0 1px 2px rgba(0,0,0,.4);
      --toast-bg:#ECEEF3; --toast-fg:#16181D; --toast-shadow:0 8px 24px rgba(0,0,0,.5); --toast-ok:#1F9D55; --toast-bad:#C62828; --toast-mut:#5B6070;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
  body { padding:24px; display:flex; flex-direction:column; gap:16px; }
  button, input { font-family:inherit; }
  [hidden] { display:none !important; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
  .card-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  h2 { margin:0; font-size:14px; font-weight:650; }
  .mut { color:var(--mut); } .faint { color:var(--faint); font-size:12px; }

  /* 状态卡 */
  .hero { display:flex; flex-direction:column; gap:18px; }
  .hero-top { display:flex; align-items:center; gap:14px; }
  .logo { width:44px; height:44px; border-radius:11px; background:var(--acc); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .title { font-size:18px; font-weight:650; letter-spacing:-0.01em; }
  .sub { color:var(--mut); font-size:12.5px; }
  .grow { flex-grow:1; min-width:0; }
  .svc { display:flex; align-items:center; gap:10px; }
  .state { display:flex; align-items:center; gap:6px; font-weight:600; color:var(--mut); }
  .state i { width:8px; height:8px; border-radius:50%; background:var(--dot-off); display:inline-block; }
  .state.on { color:var(--ok-text); } .state.on i { background:var(--ok); }
  .switch { border:0; padding:0; position:relative; cursor:pointer; flex-shrink:0; background:var(--off); transition:background .15s; }
  .switch::after { content:""; position:absolute; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s; }
  .switch.lg { width:46px; height:28px; border-radius:14px; } .switch.lg::after { top:3px; left:3px; width:22px; height:22px; }
  .switch.lg[aria-checked="true"] { background:var(--ok); } .switch.lg[aria-checked="true"]::after { left:21px; }
  .switch.sm { width:38px; height:22px; border-radius:11px; } .switch.sm::after { top:3px; left:3px; width:16px; height:16px; }
  .switch.sm[aria-checked="true"] { background:var(--acc); } .switch.sm[aria-checked="true"]::after { left:19px; }
  .switch:disabled { opacity:.5; cursor:not-allowed; }
  .addr { display:flex; align-items:center; gap:10px; background:var(--well); border-radius:10px; padding:8px 8px 8px 14px; }
  .addr .label { color:var(--mut); font-size:12.5px; flex-shrink:0; }
  .addr .url { flex-grow:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:all; font:500 14px ui-monospace, "SF Mono", Menlo, monospace; }
  .addr .url.empty { color:var(--faint); font-family:inherit; font-weight:400; user-select:none; }
  .chip { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:11px; background:var(--acc-weak); color:var(--acc); font-size:12px; font-weight:600; }

  /* 按钮 */
  .btn { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:8px; border:1px solid var(--field-line); background:var(--field); color:var(--fg); font-size:13px; font-weight:500; cursor:pointer; }
  .btn:disabled { color:var(--faint); cursor:not-allowed; opacity:.6; }
  .btn.lg { height:34px; padding:0 20px; font-size:13.5px; }
  .btn.primary { border:0; background:var(--acc); color:#fff; font-weight:600; }
  .btn.primary:disabled { background:var(--acc-off); color:#fff; opacity:1; }

  /* 横幅：要你处理的问题，持续到解决 */
  .banners { display:flex; flex-direction:column; gap:12px; }
  .banners:empty { display:none; }
  .banner { display:flex; align-items:flex-start; gap:12px; border:1px solid; border-radius:12px; padding:14px 16px; }
  .banner.error { background:var(--bad-bg); border-color:var(--bad-line); }
  .banner.warn { background:var(--warn-bg); border-color:var(--warn-line); }
  .banner svg { flex-shrink:0; margin-top:1px; }
  .banner.error svg { color:var(--bad); } .banner.warn svg { color:var(--warn); }
  .banner .t { font-weight:650; font-size:14px; } .banner .d { font-size:12.5px; margin-top:2px; }
  .banner.error .t { color:var(--bad-title); } .banner.error .d { color:var(--bad-text); }
  .banner.warn .t { color:var(--warn-title); } .banner.warn .d { color:var(--warn-text); }
  .banner .acts { display:flex; gap:8px; flex-shrink:0; }
  .banner.error .btn { border-color:var(--bad-line); color:var(--bad-title); background:var(--card); }
  .banner.error .btn.primary { background:var(--bad); border:0; color:#fff; }
  .banner.warn .btn { background:transparent; border-color:var(--warn-line); color:var(--warn-title); }

  /* 行内：某个字段的问题 */
  .ctlcol { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .err { color:var(--bad); font-size:12.5px; }
  .input.invalid { border-color:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
  .note { margin:4px 0 0 48px; color:var(--warn-text); font-size:12.5px; }

  /* Toast：操作结果，说完就过去 */
  .toasts { position:fixed; left:0; right:0; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; z-index:10; }
  .toast { pointer-events:auto; display:flex; align-items:center; gap:10px; max-width:520px; background:var(--toast-bg); color:var(--toast-fg); border-radius:12px; padding:12px 16px; box-shadow:var(--toast-shadow); font-size:13.5px; animation:toast-in .18s ease-out; }
  .toast.out { opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; }
  .toast svg { flex-shrink:0; } .toast.ok svg { color:var(--toast-ok); } .toast.error svg { color:var(--toast-bad); }
  .toast .x { width:26px; height:26px; margin:-4px -6px -4px 4px; border:0; border-radius:7px; background:transparent; color:var(--toast-mut); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  @keyframes toast-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* 设置 */
  .form { display:flex; flex-direction:column; gap:14px; margin-top:16px; }
  .field { display:grid; grid-template-columns:96px 1fr; align-items:center; column-gap:12px; min-height:34px; }
  .field > .name { color:var(--mut); }
  .ctl { display:flex; align-items:center; gap:10px; min-width:0; }
  .chg { display:none; align-items:center; gap:6px; color:var(--warn); font-size:12.5px; }
  .chg::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--warn); }
  .field.changed .chg { display:inline-flex; }
  .input { height:34px; border:1px solid var(--field-line); border-radius:8px; background:var(--field); color:var(--fg); padding:0 10px; font-size:13.5px; }
  .input:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }
  .input.w-port { width:100px; } .input.w-text { width:100%; max-width:320px; }
  .seg { display:inline-flex; background:var(--seg); border-radius:9px; padding:3px; }
  .seg button { height:28px; padding:0 16px; border:0; border-radius:7px; background:transparent; color:var(--mut); font-size:13px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--seg-on); color:var(--fg); font-weight:600; box-shadow:var(--shadow); }
  .opt { display:flex; align-items:center; gap:10px; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .actions { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line-soft); padding-top:16px; margin-top:2px; }
  .actions .dirty { flex-grow:1; color:var(--warn); font-size:12.5px; }

  /* 设备 */
  .dev { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line-soft); }
  .dev .ico { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--acc-weak); color:var(--acc); }
  .dev .ico.alt { background:var(--purple-weak); color:var(--purple); }
  .dev .nm { font-size:14px; font-weight:550; } .dev .meta { color:var(--mut); font-size:12px; }
  .dev .when { font-size:12.5px; color:var(--faint); } .dev .when.now { color:var(--ok-text); font-weight:550; }
  .empty-box { border:1px dashed var(--field-line); border-radius:10px; height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--faint); margin-top:4px; }
  .card.devs { padding-bottom:8px; } .card.devs.is-empty { padding-bottom:20px; }

  /* 排错信息 */
  .more { padding:0; }
  .more details + details { border-top:1px solid var(--line-soft); }
  .more summary { display:flex; align-items:center; justify-content:space-between; height:46px; padding:0 22px; cursor:pointer; list-style:none; font-size:13.5px; font-weight:550; }
  .more summary::-webkit-details-marker { display:none; }
  .more summary svg { color:var(--faint); transition:transform .15s; }
  .more details[open] summary svg { transform:rotate(90deg); }
  .more pre { margin:0 22px 18px; background:var(--well); border-radius:8px; padding:10px 12px; font:12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>

<section class="card hero">
  <div class="hero-top">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>
    </div>
    <div class="grow">
      <div class="title">Eagle WebDAV</div>
      <div class="sub" id="library">资源库：—</div>
    </div>
    <div class="svc">
      <span class="chip" id="awake" hidden><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>保持唤醒</span>
      <span class="state" id="state"><i></i><span id="stateText">未启动</span></span>
      <button type="button" class="switch lg" id="svc" role="switch" aria-checked="false" aria-label="服务开关"></button>
    </div>
  </div>

  <div class="addr">
    <span class="label">连接地址</span>
    <span class="url empty" id="address">启动后显示</span>
    <button type="button" class="btn" id="btnCopy" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><span id="copyText">复制</span>
    </button>
  </div>
</section>

<div class="banners" id="notices"></div>

<section class="card">
  <h2>设置</h2>
  <div class="form">
    <div class="field" data-key="mode">
      <span class="name">谁能访问</span>
      <div class="ctl">
        <div class="seg">
          <button type="button" id="modeLocal" aria-pressed="false">仅这台 Mac</button>
          <button type="button" id="modeLan" aria-pressed="true">局域网内的设备</button>
        </div>
        <span class="chg">已修改</span>
      </div>
    </div>
    <div class="field" data-key="port">
      <label class="name" for="port">端口</label>
      <div class="ctlcol"><div class="ctl"><input class="input w-port" id="port" type="number" min="1024" max="65535" aria-describedby="err-port"><span class="chg">已修改</span></div><div class="err" id="err-port" role="alert" hidden></div></div>
    </div>
    <div class="field" data-key="user">
      <label class="name" for="user">账号</label>
      <div class="ctlcol"><div class="ctl"><input class="input w-text" id="user" type="text" autocomplete="off" aria-describedby="err-user"><span class="chg">已修改</span></div><div class="err" id="err-user" role="alert" hidden></div></div>
    </div>
    <div class="field" data-key="pass">
      <label class="name" for="pass">密码</label>
      <div class="ctl"><input class="input w-text" id="pass" type="password" autocomplete="new-password"><span class="chg">已修改</span></div>
    </div>
    <div class="field">
      <span class="name">选项</span>
      <div class="opts">
        <div><div class="opt"><button type="button" class="switch sm" id="bonjour" role="switch" aria-checked="true" aria-label="自动发现（Bonjour）"></button><span>自动发现（Bonjour）</span></div><div class="note" id="bonjourNote" hidden></div></div>
        <div class="opt"><button type="button" class="switch sm" id="nosleep" role="switch" aria-checked="true" aria-label="有连接时阻止休眠"></button><span>有连接时阻止休眠</span></div>
      </div>
    </div>
    <div class="actions">
      <span class="dirty" id="dirty"></span>
      <button type="button" class="btn lg" id="btnDiscard" disabled>放弃</button>
      <button type="button" class="btn lg primary" id="btnSave" disabled>保存</button>
    </div>
  </div>
</section>

<section class="card devs is-empty" id="devsCard">
  <div class="card-head"><h2>最近连接的设备</h2><span class="faint" id="devCount"></span></div>
  <div id="devices"></div>
</section>

<section class="card more">
  <details>
    <summary>最近请求<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></summary>
    <pre id="reqlog">（尚无请求）</pre>
  </details>
  <details>
    <summary>日志<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></summary>
    <pre id="msglog"></pre>
  </details>
</section>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/plugin.js"></script>
</body>
</html>
